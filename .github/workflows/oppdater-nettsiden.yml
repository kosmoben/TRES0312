# Sier fra til plattformen (Realfagsambassaden/plattform) at kompendiet er endret, så nettsiden bygges på nytt.
name: Oppdater fysikkhjelp.no

on:
  push:
    branches: [main]
    paths:
      - "TRES0312_Kompendium/**"
  workflow_dispatch:

jobs:
  ring-pa:
    runs-on: ubuntu-latest
    steps:
      - name: Si fra til Realfagsambassaden/plattform
        env:
          GH_TOKEN: ${{ secrets.PLATTFORM_TOKEN }}
        run: gh api repos/Realfagsambassaden/plattform/dispatches -f event_type=kilde-oppdatert
